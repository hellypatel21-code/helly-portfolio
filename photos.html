<!doctype html>

<style>
:root{
    --bg:#F5F3EE;

    --ink:#20272A;

  p{margin:0;}
  a{color:var(--pine);text-decoration:none;border-bottom:1px solid rgba(40,86,76,0.4);}

  .nav a{border-bottom:none;color:var(--ink-soft);font-size:0.97rem;padding:8px 2px;font-family:'Bricolage Grotesque',sans-serif;font-weight:500;}
  .nav a:hover{color:var(--pine);}
  .nav .here{color:var(--ink);border-bottom:2px solid var(--pine);}
  .photo{width:100%;height:auto;display:block;border-radius:4px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;}
  @media (max-width:820px){ .two{grid-template-columns:1fr;gap:36px;} }

      <span class="sans" style="font-size:1.02rem;">Helly Patel</span>
      <div class="nav" style="display:flex;gap:26px;flex-wrap:wrap;">
        <a href="index.html">Introduction</a>
        <a class="here" href="photos.html">Photos</a>
        <a href="what-is-an-ra.html">What is an RA?</a>
      </div>
    </div>
  </div>

    <h1 style="font-size:clamp(1.85rem,4.2vw,2.8rem);line-height:1.15;max-width:640px;">A few pictures of me</h1>

    <div class="two" style="margin-top:46px;">

      <img class="photo" src="images/project.jpeg" alt="Helly presenting a project poster at a campus showcase" >

    <p style="margin-top:58px;color:var(--ink-soft);">
